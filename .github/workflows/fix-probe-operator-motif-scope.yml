name: Fix probe/operator motif scope

on:
  push:
    branches: ["add-probe-operator-tomography-line"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-probe-operator-tomography-line
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fix_probe_operator_motif_scope.py
      - name: Commit motif scope fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/motifs.json data/passes/probe-operator-tomography.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: register probe-defined operator motif globally"
          git push origin HEAD:add-probe-operator-tomography-line
