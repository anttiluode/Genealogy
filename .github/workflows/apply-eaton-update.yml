name: Apply EATON genealogy update

on:
  push:
    branches: ["add-eaton-handoff-demo"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-eaton-handoff-demo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply one-shot curated update
        run: |
          sed -i 's/"held_out": false/"held_out": False/g; s/"external_data": false/"external_data": False/g' scripts/apply_eaton_genealogy_update.py
          python scripts/apply_eaton_genealogy_update.py
          python - <<'PY'
          import json
          from pathlib import Path

          motifs_path = Path('data/motifs.json')
          motifs = json.loads(motifs_path.read_text(encoding='utf-8'))
          neg = next(item for item in motifs if item['id'] == 'negative-results')
          if 'AdaptiveObserverCache' not in neg['nodes']:
              neg['nodes'].append('AdaptiveObserverCache')

          handoff = {
              'id': 'transient-operator-handoff',
              'title': 'An event can invoke an operator whose residue outlives its expression',
              'description': 'Across the resident-machine line, small addressed events act on richer state already present at the destination. EATON isolates a scheduling version of that motif: invoke a local operator, let it write resident state, cross the useful boundary, then release it before a different operator consumes the residue. v0 is only a constructed gating demonstration because its coefficients force the tonic overwrite; AdaptiveObserverCache supplies the harder open case in a frozen pretrained transformer, where local decision control survives but continuation control can still fail.',
              'nodes': [
                  'ActiveVectorNN',
                  'SimpleNeuron',
                  'NSSN2',
                  'FrequencyAddressedNonlinearModalCell',
                  'OperatorTime',
                  'AdaptiveObserverCache',
                  'EATON',
              ],
          }
          for i, item in enumerate(motifs):
              if item['id'] == handoff['id']:
                  motifs[i] = handoff
                  break
          else:
              motifs.append(handoff)
          motifs_path.write_text(json.dumps(motifs, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          eaton_path = Path('data/passes/eaton.json')
          eaton = json.loads(eaton_path.read_text(encoding='utf-8'))
          eaton['motifs'] = []
          eaton_path.write_text(json.dumps(eaton, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate generated atlas
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html data/evidence.json data/evidence_motif_relations.json data/motifs.json data/questions.json data/repos.json data/passes/adaptive-observer-cache.json data/passes/eaton.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Update Genealogy for EATON and AOC first-ask result"
          git push origin HEAD:add-eaton-handoff-demo
